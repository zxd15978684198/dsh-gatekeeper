# .pre-commit-config.yaml — prek reads the same format as pre-commit.
# Generated by gatekeeper from the 2-modern-python skill.
#
# `rev: "<latest>"` is the skill's own placeholder convention.
# Replace each one with a release tag, or run `prek auto-update --cooldown-days 7`.
#
# The two `repo: local` hooks at the bottom run this repository's own commit
# profile, so a hook run, a laptop run and CI execute the same stage list instead
# of a hand-kept copy of it.

default_language_version:
  python: python3.13

repos:
  # Ruff — linting and formatting; replaces black, isort, flake8, pylint.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "<latest>"  # https://github.com/astral-sh/ruff-pre-commit/releases
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # prek builtin hooks — Rust-native, no external repos to clone.
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  # Security hooks that are not Python, so they cannot come from uv.lock.
  # The credential scan is deliberately NOT here: it runs from the project's
  # locked detection tooling in the `repo: local` section below.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: "<latest>"  # https://github.com/koalaman/shellcheck-precommit/tags
    hooks:
      - id: shellcheck
        args: [--severity=error]

  - repo: https://github.com/rhysd/actionlint
    rev: "<latest>"  # https://github.com/rhysd/actionlint/releases
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: "<latest>"  # https://github.com/zizmorcore/zizmor-pre-commit/releases
    hooks:
      - id: zizmor
        args: [--persona=regular, --min-severity=medium, --min-confidence=medium]

  # The repository's own gates, through uv so the hook and CI use one locked
  # toolchain. `pass_filenames: false`: the profile selects its own stages and
  # files, and a hook-filtered file list would quietly make it weaker than CI.
  # `always_run: true`: a commit that touches nothing a hook matches must still
  # run the gate instead of reporting success by skipping it.
  - repo: local
    hooks:
      - id: gatekeeper
        name: gatekeeper (commit profile)
        entry: uv run --locked python scripts/ci.py --profile commit
        language: system
        pass_filenames: false
        always_run: true
      - id: gatekeeper-secrets
        name: gatekeeper (secrets, staged)
        entry: uv run --locked python scripts/secret_scan.py --staged
        language: system
        pass_filenames: false
        always_run: true
